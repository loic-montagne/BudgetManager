name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BudgetManager.sln

      - name: Build
        run: dotnet build BudgetManager.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test
          --solution BudgetManager.sln
          --configuration Release
          --no-build
          --results-directory TestResults
          --
          --report-xunit-trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-include "[BudgetManager.*]*"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
